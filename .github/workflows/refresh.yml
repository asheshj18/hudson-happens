name: Refresh events
on:
  schedule:
    - cron: "0 10,16,22 * * *"   # 3x a day (UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: python3 scripts/fetch_events.py
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add site/data/events.json
          if [ -f data/serpapi_cache.json ]; then git add data/serpapi_cache.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Refresh events"
          # main may have moved during the ~4 min fetch; replay on top, keeping this run's fresh data
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
